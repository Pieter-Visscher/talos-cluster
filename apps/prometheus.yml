apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-stack
  namespace: argocd 
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts 
    targetRevision: "*"
    chart: kube-prometheus-stack 
    helm:
      values: |
        grafana:
          persistence:
            enabled: true
            size: 10Gi
          service:
            type: LoadBalancer
        
        prometheus:
          prometheusSpec:
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storaceClassName: longhorn-2replica
                  resources:
                    requests:
                      storage: 100Gi
            retention: 7d
            
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
