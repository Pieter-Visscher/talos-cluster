cluster:
  controllerManager:
    extraARgs:
      bind-address: 0.0.0.0
  etcd:
    extraArgs:
      listen-metrics-urls: https://0.0.0.0:2381
  network:
    cni:
      name: "none"
  proxy:
    disabled: true
  apiServer:
    admissionControl:
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1beta1
          kind: PodSecurityConfiguration
          exemptions:
            namespaces:
              - longhorn-system
